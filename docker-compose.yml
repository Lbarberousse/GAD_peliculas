services:
  nessie:
    image: projectnessie/nessie:latest
    depends_on:
      - nessie-data
    environment:
      NESSIE_VERSION_STORE_TYPE: JDBC
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://nessie-data:5432/nessie
      QUARKUS_DATASOURCE_USERNAME: nessie
      QUARKUS_DATASOURCE_PASSWORD: password
      QUARKUS_PROFILE: prod
      QUARKUS_HTTP_PORT: 19120
      QUARKUS_LOG_CONSOLE_FORMAT: "%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{1.}] (%t) %s%e%n"
      QUARKUS_LOG_LEVEL: INFO
      NESSIE_VERSION_STORE_GARBAGE_COLLECTION_ENABLED: "false"
      NESSIE_VERSION_STORE_RETENTION_DURATION: P30D
    ports:
      - "19120:19120"
    networks:
      - dremio-pg-superset

  nessie-data:
    image: postgres:13
    environment:
      POSTGRES_USER: nessie
      POSTGRES_PASSWORD: password
      POSTGRES_DB: nessie
    volumes:
      - nessie_data_volume:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - pgnetwork
      - dremio-pg-superset

  pgadmin:
    image: dpage/pgadmin4
    depends_on:
      - nessie-data
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8081:80"
    networks:
      - pgnetwork

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
      MINIO_DOMAIN: storage
      MINIO_REGION_NAME: us-east-1
      MINIO_REGION: us-east-1
    volumes:
      - ./minio/data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - dremio-pg-superset

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set myminio http://minio:9000 admin password; do sleep 2; done;
      mc mb --ignore-existing myminio/warehouse;
      mc rm --recursive --force myminio/warehouse/raw;
      mc rm --recursive --force myminio/warehouse/clean;
      mc cp --recursive /seed-data/raw/ myminio/warehouse/raw/;
      mc cp --recursive /seed-data/clean/ myminio/warehouse/clean/;
      exit 0;
      "
    volumes:
      - ./data:/seed-data:ro
    networks:
      - dremio-pg-superset

  dremio:
    image: dremio/dremio-oss:latest
    platform: linux/x86_64
    hostname: dremio
    depends_on:
      - minio
      - minio-init
      - nessie
    environment:
      DREMIO_JAVA_EXTRA_OPTS: >-
        -Dpaths.dist=file:///opt/dremio/data/dist
        -Dfs.s3a.path.style.access=true
        -Dfs.s3a.endpoint=http://minio:9000
        -Ddremio.nessie.defaultBranch=main
        -Ddremio.nessie.authentication.enabled=false
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
    ports:
      - "9047:9047"
      - "31010:31010"
      - "32010:32010"
      - "45678:45678"
    volumes:
      - ./dremio/data:/opt/dremio/data
      - ./dremio/lib:/var/lib/dremio
      - ./dremio/local:/localFiles
    networks:
      - dremio-pg-superset

  superset:
    image: alexmerced/dremio-superset
    depends_on:
      - nessie-data
    environment:
      DATABASE_DB: nessie
      DATABASE_HOST: nessie-data
      DATABASE_PASSWORD: password
      DATABASE_USER: nessie
      DATABASE_PORT: 5432
    volumes:
      - superset_data:/app/superset_home
    ports:
      - "8082:8088"
    networks:
      - dremio-pg-superset

networks:
  dremio-pg-superset:
  pgnetwork:
    driver: bridge

volumes:
  nessie_data_volume:
  superset_data:
